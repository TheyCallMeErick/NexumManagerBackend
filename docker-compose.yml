version: "3.8"

services:
  mongo-nexum-manager:
    image: mongo:latest
    container_name: mongo-nexum-manager
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
